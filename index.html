<style>
  :root{
    /* light: pale sage page, deep plum ink */
    --ink: #E9EEE3;
    --surface: #FBFCF8;
    --surface-2: #D9E1D1;
    --surface-2-hover: #CBD5C2;
    --mist: #6F7869;
    --paper: #2C2740;
    --accent: #5F4B8B;
    --running: #7A5FBF;
    --sage: #6F8F68;
    --ring-track: rgba(44,39,64,0.10);

    --font-display: 'Outfit', 'Helvetica Neue', Helvetica, sans-serif;
    --font-body: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    --font-mono: 'Space Mono', monospace;
  }

  @media (prefers-color-scheme: dark){
    :root{
      /* dark: deep aubergine page, pale sage ink */
      --ink: #1C1B24;
      --surface: #26242F;
      --surface-2: #322F40;
      --surface-2-hover: #3D3950;
      --mist: #8E8A9C;
      --paper: #E8EAE2;
      --accent: #B9A5E8;
      --running: #A98CE0;
      --sage: #9BBE90;
      --ring-track: rgba(232,234,226,0.10);
    }
  }

  *{ box-sizing:border-box; }

  html,body{
    margin:0;
    background: var(--ink);
    color: var(--paper);
    font-family: var(--font-body);
    -webkit-font-smoothing:antialiased;
  }

  body{
    min-height:100vh;
    padding: calc(28px + env(safe-area-inset-top)) 16px 60px;
    display:flex;
    justify-content:center;
  }

  body.is-dragging{
    user-select: none;
    -webkit-user-select: none;
    cursor: grabbing;
  }

  .page{ width:100%; max-width: 560px; }

  header{ margin-bottom: 22px; }

  .eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 8px;
  }

  h1{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: clamp(30px, 8vw, 42px);
    letter-spacing: 0.005em;
    margin: 0 0 12px;
    line-height: 1.04;
  }

  .meeting-row{
    display:flex;
    align-items:center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }

  .meeting-countdown{
    font-family: var(--font-mono);
    font-size: 13px;
    color: var(--mist);
    margin: 0;
  }

  .meeting-countdown span{
    color: var(--paper);
    font-weight: 700;
  }

  .meeting-time-edit{
    display:flex;
    align-items:center;
    gap: 6px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--mist);
  }

  .meeting-time-edit input[type="text"]{
    font-family: var(--font-body);
    font-size: 12px;
    background: var(--surface-2);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 6px 9px;
    width: 150px;
  }

  .meeting-time-edit input[type="text"]::placeholder{ color: var(--mist); }

  .meeting-countdown span#milestoneName{ text-transform: none; }

  .meeting-time-edit input[type="time"]{
    font-family: var(--font-mono);
    font-size: 11px;
    background: var(--surface-2);
    color: var(--paper);
    border: none;
    border-radius: 8px;
    padding: 5px 8px;
  }

  .progress-note{
    margin-top: 6px;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--sage);
  }

  .tick-toggle{
    font-family: var(--font-mono);
    font-size: 11px;
    margin-top: 8px;
    padding: 6px 12px;
    border-radius: 999px;
    border: 1px solid var(--surface-2);
    background: transparent;
    color: var(--mist);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .tick-toggle:hover{ border-color: var(--accent); color: var(--accent); }

  .tick-toggle.on{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--ink);
  }

  .runway{
    position: relative;
    padding-left: 40px;
  }

  .track-line{
    position: absolute;
    left: 15px;
    top: 16px;
    bottom: 16px;
    width: 2px;
    background: linear-gradient(to bottom, var(--mist), var(--accent));
    opacity: 0.4;
  }

  .task{
    position: relative;
    margin-bottom: 18px;
  }

  .task.dragging{
    opacity: 0.6;
  }

  .task.dragging .card{
    outline: 2px dashed var(--accent);
    outline-offset: 2px;
  }

  .node{
    position: absolute;
    left: -40px;
    top: 6px;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: var(--surface);
    border: 2px solid var(--mist);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--paper);
    transition: background 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
    z-index: 1;
    cursor: pointer;
  }

  .task.running .node{
    border-color: var(--running);
    color: var(--running);
  }

  .task.done .node{
    background: var(--sage);
    border-color: var(--sage);
    color: var(--ink);
    transform: scale(1.05);
  }

  .card{
    position: relative;
    background: var(--surface);
    border-radius: 14px;
    padding: 16px 46px 16px 18px;
    transition: background 0.3s ease, opacity 0.3s ease;
  }

  /* full-height grip strip down the right edge — a big target you can't miss */
  .grip{
    position: absolute;
    top: 0;
    right: 0;
    bottom: 0;
    width: 34px;
    border: none;
    border-radius: 0 14px 14px 0;
    background: var(--surface-2);
    color: var(--mist);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
    -webkit-touch-callout: none;
    transition: background 0.2s ease, color 0.2s ease;
  }

  .grip:hover{ background: var(--surface-2-hover); color: var(--accent); }
  .grip:active{ cursor: grabbing; }

  .grip span{
    font-size: 17px;
    line-height: 1;
    transform: rotate(90deg);
    pointer-events: none;
  }

  .task.done .grip{ opacity: 0.5; }

  .task.done .card{
    background: transparent;
    opacity: 0.55;
  }

  .card-head{
    display:flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 4px;
  }

  .card-head h3{
    font-family: var(--font-display);
    font-weight: 500;
    font-size: 19px;
    margin: 0;
    cursor: pointer;
  }

  .task.done .card-head h3{
    text-decoration: line-through;
    text-decoration-color: var(--sage);
  }

  .head-right{
    display:flex;
    align-items:center;
    gap: 6px;
    flex-shrink: 0;
  }

  .est{
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--mist);
    white-space: nowrap;
  }

  .icon-btn{
    font-size: 13px;
    line-height: 1;
    color: var(--mist);
    background: none;
    border: none;
    cursor: pointer;
    padding: 4px 5px;
    border-radius: 6px;
  }
  .icon-btn:hover{ color: var(--accent); background: var(--surface-2); }

  .move-btn{
    font-family: var(--font-mono);
    font-size: 11px;
  }

  .opts{
    display: flex;
    gap: 6px;
    margin: 0 0 10px;
  }

  .opt{
    font-family: var(--font-mono);
    font-size: 11px;
    padding: 5px 11px;
    border-radius: 999px;
    border: 1px solid var(--surface-2);
    background: transparent;
    color: var(--mist);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .opt:hover{ border-color: var(--accent); color: var(--accent); }

  .opt.selected{
    background: var(--accent);
    border-color: var(--accent);
    color: var(--ink);
  }

  .note{
    font-size: 13px;
    color: var(--mist);
    margin: 0 0 10px;
  }

  .timer-row{
    display:flex;
    align-items:center;
    gap: 14px;
    margin-top: 10px;
  }

  .ring-wrap{
    position: relative;
    width: 52px;
    height: 52px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .ring{
    width: 52px;
    height: 52px;
    transform: rotate(-90deg);
  }

  .ring-bg{
    fill: none;
    stroke: var(--ring-track);
    stroke-width: 8;
  }

  .ring-fg{
    fill: none;
    stroke: var(--running);
    stroke-width: 8;
    stroke-linecap: round;
    stroke-dasharray: 282.7;
    stroke-dashoffset: 0;
    transition: stroke-dashoffset 1s linear;
  }

  .task.done .ring-fg{ stroke: var(--sage); }

  .ring-label{
    position: absolute;
    inset: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family: var(--font-mono);
    font-size: 11px;
    font-weight: 700;
    pointer-events: none;
  }

  .controls{
    display:flex;
    gap: 8px;
    margin-left: auto;
  }

  .btn{
    font-family: var(--font-body);
    font-size: 13px;
    font-weight: 600;
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid transparent;
    background: var(--surface-2);
    color: var(--paper);
    cursor: pointer;
    transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease;
  }

  .btn:hover{ background: var(--surface-2-hover); }

  .btn:focus-visible{
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .btn.start.is-running{
    background: var(--running);
    color: var(--ink);
  }

  .btn.reset{
    background: transparent;
    border-color: var(--surface-2);
    color: var(--mist);
  }

  .task.done .btn.start{
    pointer-events: none;
    opacity: 0.5;
  }

  .finish{
    margin: 12px 0 24px;
    padding: 16px 18px;
    border-radius: 14px;
    background: var(--surface);
    display:flex;
    align-items:center;
    gap: 12px;
  }

  .finish .node{
    position: static;
    border-color: var(--accent);
    color: var(--accent);
    cursor: default;
  }

  .finish p{
    margin:0;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--mist);
  }

  .finish strong{ color: var(--paper); }

  .add-task{
    display:flex;
    gap: 8px;
    align-items:center;
    margin-top: 4px;
  }

  .add-task input[type="text"]{
    flex: 1;
    font-family: var(--font-body);
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 10px;
    border: 1px solid var(--surface-2);
    background: var(--surface);
    color: var(--paper);
  }

  .add-task input[type="number"]{
    width: 64px;
    font-family: var(--font-mono);
    font-size: 12px;
    padding: 10px 8px;
    border-radius: 10px;
    border: 1px solid var(--surface-2);
    background: var(--surface);
    color: var(--paper);
  }

  .add-task .btn{
    background: var(--accent);
    color: var(--ink);
    white-space: nowrap;
  }
  .add-task .btn:hover{ background: var(--running); }

  .hint{
    font-family: var(--font-mono);
    font-size: 11px;
    line-height: 1.7;
    color: var(--mist);
    margin: 10px 0 0;
  }

  @media (prefers-reduced-motion: reduce){
    .ring-fg, .node, .card, .btn{ transition: none; }
  }
</style>
</head>
<body>
<div class="page">
  <header>
    <p class="eyebrow">Daily routine · resets each day</p>
    <h1>Runway to <span id="meetingTimeLabel">2:30 PM</span></h1>
    <div class="meeting-row">
      <p class="meeting-countdown"><span id="milestoneName">Meeting</span> in <span id="meetingMins">—</span></p>
      <div class="meeting-time-edit">
        <input type="text" id="milestoneInput" placeholder="what's the deadline?" value="Milestone" maxlength="40">
        <input type="time" id="meetingTimeInput" value="14:30">
      </div>
    </div>
    <p class="progress-note" id="progressNote">Loading today's list…</p>
    <button class="tick-toggle" id="tickToggle" type="button">🔇 Ticking off</button>
  </header>

  <div class="runway">
    <div class="track-line"></div>
    <div class="tasks" id="tasks"></div>
  </div>

  <div class="add-task">
    <input type="text" id="newTaskName" placeholder="Add a task…">
    <input type="number" id="newTaskMinutes" min="1" value="5">
    <button class="btn" id="addTaskBtn">Add</button>
  </div>
  <p class="hint">Tap the circle, ring, or task name to check it off — timer or no timer.<br>Hold the strip on the right and drag to reorder, or nudge with ▲▼. ✕ removes a task for good.</p>

  <div class="finish">
    <div class="node">✓</div>
    <p><strong id="meetingTimeLabel2">2:30 PM</strong> — <span id="milestoneName2">Meeting</span></p>
  </div>
</div>

<script>
  /* Claude artifacts provide window.storage; anywhere else, fall back to
     localStorage so the file works as a self-hosted page too. */
  const store = (window.storage && typeof window.storage.get === 'function')
    ? window.storage
    : {
        get: async (k) => {
          const v = localStorage.getItem(k);
          if (v === null) throw new Error('not found');
          return { key: k, value: v };
        },
        set: async (k, v) => { localStorage.setItem(k, v); return { key: k, value: v }; }
      };

  const DEFAULT_TASKS = [
    { id: 't1', name: 'Tidy bed', minutes: 3 },
    { id: 't2', name: 'Brush teeth', minutes: 3 },
    { id: 't3', name: 'Do hair', minutes: 2 },
    { id: 't4', name: 'Take probiotics', minutes: 2, note: 'With 1–2 cups of water.' },
    { id: 't5', name: 'Miscellaneous bathroom time', minutes: 15 },
    { id: 't6', name: 'Wash face', minutes: 3 },
    { id: 't7', name: 'Journal', minutes: 5, options: [5, 10, 15] },
    { id: 't8', name: 'Make coffee', minutes: 3, note: 'Brew, pour, then sip through the rest of the list.' },
    { id: 't9', name: 'Clean litter boxes', minutes: 10 },
    { id: 't10', name: 'Morning tidy sweep', minutes: 5 },
  ];
  const DEFAULT_MEETING_TIME = '14:30';
  const DEFAULT_MILESTONE = 'Milestone';

  const CIRC = 2 * Math.PI * 45;
  const tasksEl = document.getElementById('tasks');
  const progressNote = document.getElementById('progressNote');
  const meetingTimeInput = document.getElementById('meetingTimeInput');
  const meetingTimeLabel = document.getElementById('meetingTimeLabel');
  const meetingTimeLabel2 = document.getElementById('meetingTimeLabel2');
  const milestoneInput = document.getElementById('milestoneInput');
  const milestoneName = document.getElementById('milestoneName');
  const milestoneName2 = document.getElementById('milestoneName2');
  const controllers = [];

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
  }

  function formatTime(s){
    s = Math.max(0, Math.round(s));
    const m = Math.floor(s / 60).toString().padStart(2, '0');
    const sec = Math.floor(s % 60).toString().padStart(2, '0');
    return m + ':' + sec;
  }

  function to12h(hhmm){
    const [h, m] = hhmm.split(':').map(Number);
    const period = h >= 12 ? 'PM' : 'AM';
    let h12 = h % 12; if (h12 === 0) h12 = 12;
    return h12 + ':' + String(m).padStart(2,'0') + ' ' + period;
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  let config = { tasks: DEFAULT_TASKS, meetingTime: DEFAULT_MEETING_TIME, milestone: DEFAULT_MILESTONE, ticking: false };
  let completions = {};
  const COMPLETIONS_KEY = 'completions-' + todayKey();

  async function loadConfig(){
    try{
      const res = await store.get('config-v2', false);
      if (res && res.value) config = JSON.parse(res.value);
    } catch(e){
      try{ await store.set('config-v2', JSON.stringify(config), false); } catch(e2){}
    }
  }

  async function loadCompletions(){
    try{
      const res = await store.get(COMPLETIONS_KEY, false);
      if (res && res.value) completions = JSON.parse(res.value);
    } catch(e){ completions = {}; }
  }

  async function saveConfig(){
    try{ await store.set('config-v2', JSON.stringify(config), false); } catch(e){}
  }

  async function saveCompletions(){
    try{ await store.set(COMPLETIONS_KEY, JSON.stringify(completions), false); } catch(e){}
  }

  function updateProgressNote(){
    const total = config.tasks.length;
    const done = config.tasks.filter(t => completions[t.id]).length;
    progressNote.textContent = total === 0
      ? 'No tasks yet — add your first one below.'
      : done + ' of ' + total + ' done today.';
  }

  let sharedCtx = null;
  function audioCtx(){
    if (!sharedCtx) sharedCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (sharedCtx.state === 'suspended') sharedCtx.resume();
    return sharedCtx;
  }

  function beep(freq, startAt, dur, gainPeak){
    const ctx = audioCtx();
    const o = ctx.createOscillator();
    const g = ctx.createGain();
    o.type = 'sine';
    o.frequency.value = freq;
    g.gain.value = 0.0001;
    o.connect(g); g.connect(ctx.destination);
    o.start(startAt);
    g.gain.exponentialRampToValueAtTime(gainPeak, startAt + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, startAt + dur);
    o.stop(startAt + dur + 0.02);
  }

  function chime(){
    // three-beep alarm, more noticeable than a single tone
    try{
      const ctx = audioCtx();
      const now = ctx.currentTime;
      [0, 0.32, 0.64].forEach(offset => beep(880, now + offset, 0.22, 0.11));
    } catch(e) {}
  }

  function tick(){
    try{ beep(440, audioCtx().currentTime, 0.045, 0.045); } catch(e) {}
  }

  /* ---------- drag to reorder ----------
     Listeners live on document, not the handle: reordering moves the task node
     mid-drag, which would drop pointer capture and hand the gesture back to the
     browser's text selection. Document-level listeners survive the move. */
  let dragEl = null;

  async function persistOrder(){
    const order = [...tasksEl.querySelectorAll('.task')].map(el => el.dataset.taskId);
    config.tasks.sort((a, b) => order.indexOf(a.id) - order.indexOf(b.id));
    await saveConfig();
  }

  function elementAfterY(y){
    const others = [...tasksEl.querySelectorAll('.task:not(.dragging)')];
    return others.find(el => {
      const box = el.getBoundingClientRect();
      return y < box.top + box.height / 2;
    }) || null;
  }

  function onDragMove(e){
    if (!dragEl) return;
    e.preventDefault();
    const after = elementAfterY(e.clientY);
    if (after){
      if (after !== dragEl.nextElementSibling) tasksEl.insertBefore(dragEl, after);
    } else if (tasksEl.lastElementChild !== dragEl){
      tasksEl.appendChild(dragEl);
    }
  }

  async function onDragEnd(){
    if (!dragEl) return;
    dragEl.classList.remove('dragging');
    document.body.classList.remove('is-dragging');
    dragEl = null;
    document.removeEventListener('pointermove', onDragMove);
    document.removeEventListener('pointerup', onDragEnd);
    document.removeEventListener('pointercancel', onDragEnd);
    await persistOrder();
  }

  function attachDrag(handle, el){
    handle.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      dragEl = el;
      el.classList.add('dragging');
      document.body.classList.add('is-dragging');
      document.addEventListener('pointermove', onDragMove, { passive: false });
      document.addEventListener('pointerup', onDragEnd);
      document.addEventListener('pointercancel', onDragEnd);
    });
    handle.addEventListener('dragstart', (e) => e.preventDefault());
    handle.addEventListener('contextmenu', (e) => e.preventDefault());
  }

  /* ---------- task cards ---------- */
  function mountTaskCard(task, container){
    let duration = task.minutes * 60;
    const alreadyDone = !!completions[task.id];

    const el = document.createElement('div');
    el.className = 'task' + (alreadyDone ? ' done' : '');
    el.dataset.taskId = task.id;
    el.innerHTML =
      '<div class="node">' + (alreadyDone ? '✓' : '') + '</div>' +
      '<div class="card">' +
        '<div class="card-head">' +
          '<h3>' + escapeHtml(task.name) + '</h3>' +
          '<div class="head-right">' +
            '<span class="est">' + task.minutes + ' min</span>' +
            '<button class="icon-btn move-btn move-up" title="Move up">▲</button>' +
            '<button class="icon-btn move-btn move-down" title="Move down">▼</button>' +
            '<button class="icon-btn remove-btn" title="Remove task">✕</button>' +
          '</div>' +
        '</div>' +
        (task.note ? '<p class="note">' + escapeHtml(task.note) + '</p>' : '') +
        (task.options ? '<div class="opts">' + task.options.map(m =>
            '<button class="opt" data-min="' + m + '">' + m + ' min</button>').join('') + '</div>' : '') +
        '<div class="timer-row">' +
          '<div class="ring-wrap">' +
            '<svg class="ring" viewBox="0 0 100 100">' +
              '<circle class="ring-bg" cx="50" cy="50" r="45"></circle>' +
              '<circle class="ring-fg" cx="50" cy="50" r="45"></circle>' +
            '</svg>' +
            '<div class="ring-label">' + (alreadyDone ? 'Done' : formatTime(duration)) + '</div>' +
          '</div>' +
          '<div class="controls">' +
            '<button class="btn start">' + (alreadyDone ? 'Done' : 'Start') + '</button>' +
            '<button class="btn reset">Reset</button>' +
          '</div>' +
        '</div>' +
        '<button class="grip" title="Hold and drag to reorder"><span>⠿</span></button>' +
      '</div>';
    container.appendChild(el);

    const nodeEl = el.querySelector('.node');
    const titleEl = el.querySelector('h3');
    const ringWrap = el.querySelector('.ring-wrap');
    const ringFg = el.querySelector('.ring-fg');
    const ringLabel = el.querySelector('.ring-label');
    const startBtn = el.querySelector('.btn.start');
    const resetBtn = el.querySelector('.btn.reset');
    const removeBtn = el.querySelector('.remove-btn');
    const grip = el.querySelector('.grip');
    const upBtn = el.querySelector('.move-up');
    const downBtn = el.querySelector('.move-down');

    ringFg.style.strokeDasharray = CIRC;
    ringFg.style.strokeDashoffset = alreadyDone ? CIRC : 0;

    let remaining = alreadyDone ? 0 : duration;
    let endAt = null;
    let intervalId = null;
    let isDone = alreadyDone;

    function render(){
      ringFg.style.strokeDashoffset = CIRC * (1 - remaining / duration);
      ringLabel.textContent = formatTime(remaining);
    }

    function stopTimer(){
      clearInterval(intervalId);
      intervalId = null;
      endAt = null;
      lastTickSecond = null;
    }

    function markDone(fromTimer){
      stopTimer();
      remaining = 0;
      isDone = true;
      render();
      ringLabel.textContent = 'Done';
      el.classList.remove('running');
      el.classList.add('done');
      startBtn.textContent = 'Done';
      startBtn.classList.remove('is-running');
      nodeEl.textContent = '✓';
      completions[task.id] = true;
      saveCompletions();
      updateProgressNote();
      if (fromTimer) chime();
    }

    function markUndone(){
      stopTimer();
      remaining = duration;
      isDone = false;
      render();
      el.classList.remove('running', 'done');
      startBtn.textContent = 'Start';
      startBtn.classList.remove('is-running');
      nodeEl.textContent = '';
      delete completions[task.id];
      saveCompletions();
      updateProgressNote();
    }

    let lastTickSecond = null;
    function sync(){
      if (endAt === null) return;
      const left = (endAt - Date.now()) / 1000;
      if (left <= 0) { lastTickSecond = null; markDone(true); return; }
      remaining = left;
      render();
      const wholeSecond = Math.ceil(remaining);
      if (config.ticking && wholeSecond !== lastTickSecond && wholeSecond > 0){
        lastTickSecond = wholeSecond;
        tick();
      }
    }

    startBtn.addEventListener('click', () => {
      if (isDone) return;
      if (endAt !== null){
        sync();
        if (isDone) return;
        stopTimer();
        el.classList.remove('running');
        startBtn.textContent = 'Start';
        startBtn.classList.remove('is-running');
      } else {
        endAt = Date.now() + remaining * 1000;
        intervalId = setInterval(sync, 1000);
        el.classList.add('running');
        startBtn.textContent = 'Pause';
        startBtn.classList.add('is-running');
      }
    });

    resetBtn.addEventListener('click', markUndone);

    function toggleDone(){
      if (isDone) markUndone();
      else markDone(false);
    }
    nodeEl.addEventListener('click', toggleDone);
    ringWrap.addEventListener('click', toggleDone);
    titleEl.addEventListener('click', toggleDone);

    removeBtn.addEventListener('click', async (ev) => {
      ev.stopPropagation();
      stopTimer();
      config.tasks = config.tasks.filter(t => t.id !== task.id);
      delete completions[task.id];
      await saveConfig();
      await saveCompletions();
      el.remove();
      updateProgressNote();
    });

    const estEl = el.querySelector('.est');
    const optBtns = [...el.querySelectorAll('.opt')];

    function selectDuration(mins){
      stopTimer();
      duration = mins * 60;
      remaining = duration;
      isDone = false;
      el.classList.remove('running', 'done');
      startBtn.textContent = 'Start';
      startBtn.classList.remove('is-running');
      nodeEl.textContent = '';
      estEl.textContent = mins + ' min';
      optBtns.forEach(b => b.classList.toggle('selected', Number(b.dataset.min) === mins));
      render();
      if (completions[task.id]){
        delete completions[task.id];
        saveCompletions();
        updateProgressNote();
      }
    }

    optBtns.forEach(b => {
      if (Number(b.dataset.min) === task.minutes) b.classList.add('selected');
      b.addEventListener('click', (ev) => {
        ev.stopPropagation();
        selectDuration(Number(b.dataset.min));
      });
    });

    attachDrag(grip, el);

    upBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const prev = el.previousElementSibling;
      if (prev) { tasksEl.insertBefore(el, prev); persistOrder(); }
    });

    downBtn.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const next = el.nextElementSibling;
      if (next) { tasksEl.insertBefore(next, el); persistOrder(); }
    });
    controllers.push({ sync });
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible'){
      controllers.forEach(c => c.sync());
      updateMeetingCountdown();
    }
  });
  window.addEventListener('focus', () => controllers.forEach(c => c.sync()));

  function updateMeetingCountdown(){
    const now = new Date();
    const [hh, mm] = (config.meetingTime || DEFAULT_MEETING_TIME).split(':').map(Number);
    const target = new Date();
    target.setHours(hh, mm, 0, 0);
    const diffMs = target - now;
    const label = document.getElementById('meetingMins');
    if (diffMs <= 0){
      label.textContent = 'now';
    } else {
      const mins = Math.floor(diffMs / 60000);
      const h = Math.floor(mins / 60);
      const m = mins % 60;
      label.textContent = h > 0 ? h + 'h ' + m + 'm' : m + 'm';
    }
    const display = to12h(config.meetingTime || DEFAULT_MEETING_TIME);
    meetingTimeLabel.textContent = display;
    meetingTimeLabel2.textContent = display;
    const name = (config.milestone || DEFAULT_MILESTONE).trim() || DEFAULT_MILESTONE;
    milestoneName.textContent = name;
    milestoneName2.textContent = name;
  }

  milestoneInput.addEventListener('change', async () => {
    config.milestone = milestoneInput.value.trim() || DEFAULT_MILESTONE;
    milestoneInput.value = config.milestone;
    await saveConfig();
    updateMeetingCountdown();
  });

  meetingTimeInput.addEventListener('change', async () => {
    config.meetingTime = meetingTimeInput.value || DEFAULT_MEETING_TIME;
    await saveConfig();
    updateMeetingCountdown();
  });

  async function addTask(){
    const nameInput = document.getElementById('newTaskName');
    const minInput = document.getElementById('newTaskMinutes');
    const name = nameInput.value.trim();
    const minutes = Math.max(1, parseInt(minInput.value, 10) || 5);
    if (!name) return;
    const newTask = { id: 'task-' + Date.now(), name, minutes };
    config.tasks.push(newTask);
    await saveConfig();
    mountTaskCard(newTask, tasksEl);
    updateProgressNote();
    nameInput.value = '';
    minInput.value = 5;
    nameInput.focus();
  }

  document.getElementById('addTaskBtn').addEventListener('click', addTask);
  document.getElementById('newTaskName').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  const tickToggle = document.getElementById('tickToggle');

  function renderTickToggle(){
    tickToggle.textContent = config.ticking ? '🔊 Ticking on' : '🔇 Ticking off';
    tickToggle.classList.toggle('on', !!config.ticking);
  }

  tickToggle.addEventListener('click', async () => {
    config.ticking = !config.ticking;
    renderTickToggle();
    if (config.ticking) { try{ audioCtx(); } catch(e){} } // unlock audio on the user gesture
    await saveConfig();
  });

  async function init(){
    await loadConfig();
    await loadCompletions();
    meetingTimeInput.value = config.meetingTime || DEFAULT_MEETING_TIME;
    milestoneInput.value = config.milestone || DEFAULT_MILESTONE;
    renderTickToggle();
    config.tasks.forEach(task => mountTaskCard(task, tasksEl));
    updateProgressNote();
    updateMeetingCountdown();
    setInterval(updateMeetingCountdown, 1000);
  }

  init();
</script>
</body>
</html>
